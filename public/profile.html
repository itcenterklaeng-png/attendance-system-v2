<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a237e" />
  <title>โปรไฟล์ของฉัน — ระบบเช็คชื่อนักเรียน</title>
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1fWwwh6htzUfnuJ_UGUlY5DLEchopSbfi&sz=w128" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="alert-area"></div>

  <div class="card" style="max-width:640px;margin:0 auto;">
    <div class="card-header">
      <div class="card-title"><i class="fas fa-user-circle me-1"></i> โปรไฟล์ของฉัน</div>
    </div>

    <div id="prof-content">
      <div class="empty-state"><div class="spinner" style="margin:0 auto 1rem;"></div><p>กำลังโหลด...</p></div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { initLayout } from './js/layout.js';
    import { supabase } from './js/supabase-client.js';
    import { uploadTeacherPhoto } from './js/api.js';
    import { showAlert, esc } from './js/utils.js';

    const profile = await requireAuth();
    if (!profile) throw new Error('not authed');
    initLayout(profile, 'profile', { title: 'โปรไฟล์ของฉัน', icon: 'fa-user-circle' });

    // resize image ก่อนอัพโหลด — max width 500 (โปรไฟล์ไม่ต้องใหญ่มาก)
    function resizeImageToBlob(file, maxWidth = 500) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.85) }),
            'image/jpeg', 0.85);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    let currentPhotoUrl = null;
    let pendingPhotoBlob = null;
    let pendingPhotoDataUrl = null;

    async function load() {
      const box = document.getElementById('prof-content');
      let teacher = null;
      if (profile.teacher_id) {
        const { data, error } = await supabase
          .from('teachers')
          .select('teacher_id, full_name, email, phone, department, status, photo_url')
          .eq('teacher_id', profile.teacher_id)
          .maybeSingle();
        if (!error && data) teacher = data;
      }
      currentPhotoUrl = teacher?.photo_url || null;

      const role = profile.role === 'admin' ? 'ผู้ดูแลระบบ'
                 : profile.role === 'executive' ? 'ผู้บริหาร'
                 : 'ครู';
      const roleBg = profile.role === 'admin' ? '#dc2626'
                   : profile.role === 'executive' ? '#9333ea'
                   : '#4f46e5';

      const initial = ((teacher?.full_name || profile.full_name || profile.email || '?')
        .replace(/^(นาย|นาง|นางสาว|น\.ส\.|ว่าที่|ดร\.|ผศ\.)/, '').trim().charAt(0) || '?').toUpperCase();

      const canEdit = !!profile.teacher_id;

      box.innerHTML = `
        <div style="text-align:center;padding:1.5rem 1rem .5rem;">
          <div id="photo-wrapper" style="position:relative;display:inline-block;">
            <div id="photo-display" style="width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;box-shadow:0 6px 18px rgba(26,35,126,.35);overflow:hidden;">
              ${currentPhotoUrl
                ? `<img src="${esc(currentPhotoUrl)}" alt="โปรไฟล์" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.textContent='${esc(initial)}';">`
                : esc(initial)}
            </div>
            ${canEdit ? `
              <label for="photo-input" title="เปลี่ยนรูปโปรไฟล์" style="position:absolute;bottom:0;right:0;width:38px;height:38px;border-radius:50%;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);">
                <i class="fas fa-camera"></i>
                <input type="file" id="photo-input" accept="image/*" style="display:none;">
              </label>
            ` : ''}
          </div>
          ${currentPhotoUrl && canEdit ? `
            <div style="margin-top:.5rem;">
              <button class="btn btn-sm btn-outline-danger" id="btn-remove-photo" style="font-size:.78rem;padding:.25rem .65rem;">
                <i class="fas fa-trash me-1"></i> ลบรูป
              </button>
            </div>
          ` : ''}
          <div style="margin-top:.8rem;font-weight:700;font-size:1.15rem;color:#1a237e;">
            ${esc(teacher?.full_name || profile.full_name || profile.email)}
          </div>
          <div style="margin-top:.3rem;">
            <span style="background:${roleBg};color:#fff;padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:600;">${esc(role)}</span>
            ${profile.teacher_id ? `<span style="margin-left:6px;background:#e0e7ff;color:#3730a3;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:600;">รหัสครู: ${esc(profile.teacher_id)}</span>` : ''}
          </div>
        </div>

        <div class="row g-2" style="padding:1rem 0 0;">
          <div class="col-12">
            <label class="form-label fw-bold">Email <span style="color:#94a3b8;font-weight:400;">(แก้ไม่ได้)</span></label>
            <input class="form-control" value="${esc(profile.auth_email || profile.email || '')}" readonly style="background:#f1f5f9;color:#64748b;">
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">ชื่อ-สกุล *</label>
            <input id="p-fullname" class="form-control" value="${esc(teacher?.full_name || profile.full_name || '')}" ${canEdit ? '' : 'disabled'} placeholder="เช่น นายพงศกร พงษ์พันนา">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">เบอร์โทรศัพท์</label>
            <input id="p-phone" class="form-control" value="${esc(teacher?.phone || '')}" ${canEdit ? '' : 'disabled'} placeholder="0XXXXXXXXX" maxlength="15">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">แผนก</label>
            <input id="p-dept" class="form-control" value="${esc(teacher?.department || profile.department || '')}" ${canEdit ? '' : 'disabled'} placeholder="เช่น ช่างยนต์">
          </div>
        </div>

        <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border,#e5e7eb);display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;">
          <a href="change-password.html" class="btn btn-secondary">
            <i class="fas fa-key me-1"></i> เปลี่ยนรหัสผ่าน
          </a>
          <button class="btn btn-primary btn-lg" id="btn-save" ${canEdit ? '' : 'disabled'}>
            <i class="fas fa-save me-1"></i> บันทึกโปรไฟล์
          </button>
        </div>

        ${canEdit ? '' : `
          <div class="alert alert-info" style="margin-top:1rem;">
            <i class="fas fa-info-circle me-1"></i> บัญชี admin นี้ไม่ได้ผูกกับรหัสครู — ไม่สามารถแก้ไขข้อมูลได้
          </div>
        `}
      `;

      if (canEdit) {
        document.getElementById('btn-save').onclick = save;

        const photoInput = document.getElementById('photo-input');
        if (photoInput) {
          photoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 8 * 1024 * 1024) {
              showAlert('ไฟล์ใหญ่เกิน 8MB', 'error', 0);
              return;
            }
            try {
              const { blob, dataUrl } = await resizeImageToBlob(file, 500);
              pendingPhotoBlob = blob;
              pendingPhotoDataUrl = dataUrl;
              // แสดง preview ทันที
              document.getElementById('photo-display').innerHTML =
                `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
              showAlert('เลือกรูปแล้ว — กด "บันทึกโปรไฟล์" เพื่อยืนยัน', 'info', 3000);
            } catch (err) {
              showAlert('โหลดรูปไม่สำเร็จ: ' + err.message, 'error', 0);
            }
          });
        }

        const removeBtn = document.getElementById('btn-remove-photo');
        if (removeBtn) {
          removeBtn.onclick = () => {
            if (!confirm('ลบรูปโปรไฟล์นี้?')) return;
            currentPhotoUrl = null;
            pendingPhotoBlob = null;
            pendingPhotoDataUrl = null;
            document.getElementById('photo-display').innerHTML = esc(initial);
            removeBtn.style.display = 'none';
            showAlert('รูปจะถูกลบเมื่อกด "บันทึกโปรไฟล์"', 'info', 3000);
          };
        }
      }
    }

    async function save() {
      const btn = document.getElementById('btn-save');
      const fullName = document.getElementById('p-fullname').value.trim();
      const phone    = document.getElementById('p-phone').value.trim();
      const dept     = document.getElementById('p-dept').value.trim();

      if (!fullName) {
        showAlert('กรุณากรอกชื่อ-สกุล', 'error', 0);
        document.getElementById('p-fullname').focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> กำลังบันทึก...';

      try {
        // 1. อัพโหลดรูปใหม่ (ถ้ามี)
        let photoUrl = currentPhotoUrl;
        if (pendingPhotoBlob) {
          btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> กำลังอัพโหลดรูป...';
          const res = await uploadTeacherPhoto(pendingPhotoBlob, profile.teacher_id, 'jpg');
          photoUrl = res.url;
        }

        // 2. Save ข้อมูล
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> กำลังบันทึก...';
        const { error } = await supabase
          .from('teachers')
          .update({
            full_name: fullName,
            phone: phone || null,
            department: dept || null,
            photo_url: photoUrl,
            updated_at: new Date().toISOString()
          })
          .eq('teacher_id', profile.teacher_id);
        if (error) throw error;

        showAlert('✅ บันทึกโปรไฟล์สำเร็จ', 'success', 3000);
        pendingPhotoBlob = null;
        pendingPhotoDataUrl = null;
        setTimeout(() => window.location.reload(), 800);
      } catch (e) {
        showAlert('บันทึก fail: ' + e.message, 'error', 0);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save me-1"></i> บันทึกโปรไฟล์';
      }
    }

    await load();
  </script>
</body>
</html>
